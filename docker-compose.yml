services:
  dashboard:
    build:
      context: ./dashboard
    restart: unless-stopped
    environment:
      KEITARO_URL: ${KEITARO_URL:-}
      KEITARO_BASE_URL: ${KEITARO_BASE_URL:-}
      KEITARO_API_KEY: ${KEITARO_API_KEY:-}
      KEITARO_TIMEZONE: ${KEITARO_TIMEZONE:-Asia/Yerevan}
      KEITARO_DASHBOARD_DB: /data/keitaro-dashboard.sqlite3
      CABINET_UPDATE_HOUR: ${CABINET_UPDATE_HOUR:-11}
      KEITARO_COST_CAMPAIGN_IDS: ${KEITARO_COST_CAMPAIGN_IDS:-}
      COST_CURRENCY: ${COST_CURRENCY:-USD}
      COST_CAMPAIGN_GROUP: ${COST_CAMPAIGN_GROUP:-}
      COST_AUTO_PUSH: ${COST_AUTO_PUSH:-false}
      COST_ONLY_CAMPAIGN_UNIQUES: ${COST_ONLY_CAMPAIGN_UNIQUES:-true}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8765}:8765"
    volumes:
      - dashboard_data:/data

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://keitaro:${POSTGRES_PASSWORD:-change-me}@db:5432/keitaro
      DATABASE_SSL: "false"
      WEBHOOK_PORT: ${WEBHOOK_PORT:-3000}
    ports:
      - "127.0.0.1:${WEBHOOK_PORT:-3000}:${WEBHOOK_PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      BOT_UPSTREAM: app
      WEBHOOK_PORT: ${WEBHOOK_PORT:-3000}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keitaro
      POSTGRES_USER: keitaro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keitaro -d keitaro"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dashboard_data:
  postgres_data:
  caddy_data:
  caddy_config:
